[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chirp-comm"
version = "0.3.0"
description = "Acoustic chirp communication: send short text over sound."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "waliwuao", email = "waliwuao@users.noreply.github.com" },
]
keywords = [
    "chirp",
    "acoustic-communication",
    "data-over-sound",
    "audio",
    "dsp",
    "hamming-code",
    "signal-processing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "sounddevice>=0.4",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/WallyHao/chirp-comm"
Repository = "https://github.com/WallyHao/chirp-comm"
Issues = "https://github.com/WallyHao/chirp-comm/issues"
Changelog = "https://github.com/WallyHao/chirp-comm/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["chirp_comm*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
